# fly.toml app configuration file generated for lumina-agent-nehamm on 2026-09-17T23:04:30+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lumina-agent-nehamm'
primary_region = 'syd'

[build]
  #dockerfile = 'Dockerfile'
  dockerfile = 'backend/agent/Dockerfile'

[env]
  DEEP_DAILY_CAP = '5'
  DEEP_SUB_QUESTIONS_MAX = '6'
  DEEP_SUB_QUESTIONS_MIN = '3'
  EMBEDDING_MODEL = 'text-embedding-3-small'
  LLM_MODEL = 'claude-sonnet-5'
  LLM_PROVIDER = 'anthropic'
  LOG_LEVEL = 'info'
  MAX_TOOL_CALLS = '8'
  MAX_TOOL_CALLS_DEEP = '24'
  MAX_WALL_CLOCK_SEC = '90'
  MAX_WALL_CLOCK_SEC_DEEP = '240'
  NODE_ENV = 'production'
  PORT_AGENT = '8000'
  SEARCH_CACHE_TTL_SECONDS = '21600'
  SEARCH_PROVIDER = 'tavily'
  VECTOR_BACKEND = 'atlas-vector-search'

[processes]
  app = 'node dist/index.js'
  worker = 'node dist/worker.js'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['worker']
